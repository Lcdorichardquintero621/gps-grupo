name: gps_grupo
description: GPS en grupo con mapa libre (OpenStreetMap) y ubicación en tiempo real.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.2.3

flutter:
  uses-material-design: true
